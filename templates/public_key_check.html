<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Key Token 余量查询</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <main class="container">
    <header class="hero compact">
      <div>
        <p class="eyebrow">Public Key Check</p>
        <h1>API Key Token 余量查询</h1>
        <p class="subtitle">无需登录，输入 API Key 查询状态与 token 额度。</p>
      </div>
    </header>

    {% if let Some(v) = err %}
      <div class="banner banner-err">{{ v }}</div>
    {% endif %}

    <section class="panel panel-form">
      <h2>查询</h2>
      <form action="/key-check" method="post" class="filter-form">
        <input type="text" name="api_key" placeholder="请输入 API Key，例如 cpa_xxx 或 sk_xxx" value="{{ query_key }}" required>
        <button class="btn btn-primary" type="submit">查询余量</button>
      </form>
    </section>

    {% if let Some(v) = result %}
    <section class="panel">
      <h2>查询结果</h2>
      <div class="meta-grid">
        <div><span>状态</span><strong class="status {% if v.status == "active" %}status-active{% else %}status-disabled{% endif %}">{{ v.status }}</strong></div>
        <div><span>总额度</span><strong>{{ v.token_limit }}</strong></div>
        <div><span>已使用</span><strong>{{ v.consumed_tokens }}</strong></div>
        <div><span>剩余</span><strong>{{ v.remaining_tokens }}</strong></div>
      </div>
    </section>
    {% endif %}
  </main>
</body>
</html>
